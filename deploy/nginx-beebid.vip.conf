# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name beebid.vip;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS -> pm2 Next.js standalone server (server.js on 127.0.0.1:3400)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name beebid.vip;

    ssl_certificate /etc/letsencrypt/live/beebid.vip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beebid.vip/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Public marketing site, fully indexable.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3400;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection '';
        proxy_read_timeout 60s;
        client_max_body_size 4m;
    }
}
